<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AA Units</title>
<meta name="description" content="Anime Adventures: все юниты, DPS, DPS на 1000 денег, сравнение с бафами, трейтами и реликвиями">
<style>
:root {
  --bg: #000508; --card: #000d14; --input: #001520; --border: #002a3d; --border2: #003a55;
  --accent: #0ea5e9; --accent2: #38bdf8; --accent3: #6366f1; --text: #f0f9ff; --muted: #7fa8c4; --dim: #4d7590;
  --good: #34d399; --warn: #fbbf24; --bad: #f87171;
  --header: linear-gradient(135deg, #001428, #002244, #001428);
  --title: linear-gradient(90deg, #38bdf8, #0ea5e9, #6366f1);
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 'Segoe UI', system-ui, sans-serif; }
body { min-height: 100vh; }
a { color: var(--accent2); }
button, input, select { font: inherit; color: inherit; }
input, select {
  background: var(--input); border: 1px solid var(--border2); border-radius: 8px; padding: 6px 8px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.25); }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); padding: 0; }
.btn {
  background: var(--input); border: 1px solid var(--border2); border-radius: 10px; padding: 7px 12px; cursor: pointer;
  transition: transform .2s, border-color .2s, background .2s; white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); border-color: var(--accent); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(14,165,233,.35); }
.btn.primary { background: linear-gradient(135deg, #0369a1, #0ea5e9); border-color: #0ea5e9; font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; border-radius: 8px; }
.btn.ghost { background: transparent; }

header { background: var(--header); border-bottom: 1px solid var(--border2); }
.head-in { max-width: 1500px; margin: 0 auto; padding: 18px 16px 0; }
.head-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 26px; background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--muted); font-size: 13px; }
.head-top .sp { flex: 1; }
.lang { display: flex; border: 1px solid var(--border2); border-radius: 10px; overflow: hidden; }
.lang button { background: transparent; border: 0; padding: 6px 10px; cursor: pointer; color: var(--muted); }
.lang button.on { background: var(--accent); color: #001018; font-weight: 700; }
nav { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; }
nav button {
  background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer;
  color: var(--muted); font-weight: 600; white-space: nowrap;
}
nav button.on { color: var(--text); border-bottom-color: var(--accent); }
nav .count { background: var(--accent); color: #001018; border-radius: 999px; padding: 0 7px; font-size: 11px; margin-left: 4px; }

main { max-width: 1500px; margin: 0 auto; padding: 16px; }
.tab { display: none; }
.tab.on { display: block; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); }
.card-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card-header h2 { margin: 0; font-size: 16px; }
.card-body { padding: 14px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1 1 220px; min-width: 0; }
.toolbar label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: #001a29; color: var(--muted); font-size: 12px; font-weight: 600; z-index: 1; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--text); }
th.sort.on { color: var(--accent2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: rgba(14,165,233,.06); }
#unitTable tbody tr { cursor: pointer; }
.star { cursor: pointer; font-size: 16px; color: var(--dim); background: none; border: 0; padding: 0 2px; }
.star.on { color: var(--warn); }
.uname { font-weight: 600; }
.rar { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #001018; }
.r-Exclusive { background: #f0abfc; } .r-Secret { background: #fca5a5; } .r-Mythic { background: #fdba74; }
.r-Legendary { background: #fde68a; } .r-Epic { background: #c4b5fd; } .r-Rare { background: #93c5fd; }
.tier { display: inline-block; width: 22px; text-align: center; border-radius: 6px; font-weight: 800; color: #001018; }
.t-S { background: #f87171; } .t-A { background: #fb923c; } .t-B { background: #fbbf24; } .t-C { background: #34d399; } .t-D { background: #60a5fa; }
.dps { font-weight: 700; color: var(--accent2); }
.tag { display: inline-block; padding: 0 6px; border: 1px solid var(--border2); border-radius: 6px; font-size: 11px; color: var(--muted); }

/* сравнение */
#cmpTable td { vertical-align: top; }
#cmpTable input.uin { width: 210px; }
#cmpTable select { max-width: 170px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; max-width: 260px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: #002338; border: 1px solid var(--border2); border-radius: 999px; padding: 1px 4px 1px 8px; font-size: 11px; }
.chip button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 2px; }
.chip button:hover { color: var(--bad); }
.chips select { font-size: 12px; padding: 2px 4px; max-width: 120px; }
.gain { color: var(--good); }
.out-best { box-shadow: inset 3px 0 0 var(--good); }
.empty { padding: 30px; text-align: center; color: var(--muted); }

.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; margin-top: 16px; }
.chart .card-body { padding: 8px 10px 12px; }
.chart canvas { width: 100%; display: block; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); padding: 0 4px 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* настройки */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
.field { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.field:last-child { border-bottom: 0; }
.field small { display: block; color: var(--muted); font-size: 11px; }
.field input, .field select { width: 100%; }
.key-block { border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; background: rgba(14,165,233,.05); }

/* модальное окно */
.modal { position: fixed; inset: 0; background: rgba(0,5,8,.8); display: none; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; z-index: 20; }
.modal.on { display: flex; }
.modal .card { width: 100%; max-width: 1100px; }
.modal .close { margin-left: auto; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
.kv span:first-child { color: var(--muted); }
.note { background: var(--input); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; color: var(--muted); font-size: 13px; margin-bottom: 8px; white-space: normal; }

footer { max-width: 1500px; margin: 0 auto; padding: 10px 16px 30px; color: var(--dim); font-size: 12px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #003049; border: 1px solid var(--accent); padding: 8px 14px; border-radius: 10px; display: none; z-index: 30; }

@media (max-width: 700px) {
  h1 { font-size: 21px; }
  .charts, .grid { grid-template-columns: 1fr; }
  .field { grid-template-columns: 1fr 100px; }
  th, td { padding: 6px 7px; }
  /* на телефоне в списке: ★, имя, редкость, цена, SPA, DPS, DPS/1000, тир */
  #unitTable th:nth-child(4), #unitTable td:nth-child(4), #unitTable th:nth-child(5), #unitTable td:nth-child(5),
  #unitTable th:nth-child(6), #unitTable td:nth-child(6), #unitTable th:nth-child(8), #unitTable td:nth-child(8),
  #unitTable th:nth-child(10), #unitTable td:nth-child(10) { display: none; }
  .uname { white-space: normal; min-width: 120px; }
}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="head-top">
      <div>
        <h1>AA Units</h1>
        <div class="sub" data-ru="Anime Adventures — все юниты, DPS, выгода и сравнение" data-en="Anime Adventures — all units, DPS, value and comparison"></div>
      </div>
      <div class="sp"></div>
      <span class="tag" id="ver"></span>
      <button class="btn small" id="btnExport" data-ru="⬇ Экспорт" data-en="⬇ Export" title=""></button>
      <button class="btn small" id="btnImport" data-ru="⬆ Импорт" data-en="⬆ Import"></button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <div class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </div>
    <nav>
      <button data-tab="units" data-ru="Юниты" data-en="Units"></button>
      <button data-tab="compare"><span data-ru="Сравнение" data-en="Compare"></span><span class="count" id="cmpCount">0</span></button>
      <button data-tab="settings" data-ru="Настройки" data-en="Settings"></button>
      <button data-tab="about" data-ru="Как считается" data-en="How it works"></button>
    </nav>
  </div>
</header>

<main>
  <!-- ЮНИТЫ -->
  <section class="tab" id="tab-units">
    <div class="toolbar">
      <input class="grow" id="q" type="search" data-ph-ru="🔍 Поиск юнита…" data-ph-en="🔍 Search unit…">
      <select id="fRarity"></select>
      <select id="fType"></select>
      <select id="fRole"></select>
      <label><input type="checkbox" id="fMine"> <span data-ru="только мои" data-en="mine only"></span></label>
      <label><input type="checkbox" id="fDmg" checked> <span data-ru="только с уроном" data-en="damage only"></span></label>
      <span class="hint" id="shown"></span>
    </div>
    <div class="hint" style="margin-bottom:8px" data-ru="Всё на максимальном апгрейде, с уровнем и бафами из «Настроек» и твоими трейтами/реликвиями. Нажми на юнита — откроется карточка. ★ — юнит у тебя есть." data-en="All at max upgrade, with level and buffs from Settings and your traits/relics. Click a unit to open its card. ★ — you own it."></div>
    <div class="tbl-wrap" style="max-height:72vh">
      <table id="unitTable">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- СРАВНЕНИЕ -->
  <section class="tab" id="tab-compare">
    <div class="toolbar">
      <button class="btn primary" id="cmpAdd" data-ru="+ Добавить юнита" data-en="+ Add unit"></button>
      <label><span data-ru="Время боя, с" data-en="Battle time, s"></span>
        <select id="cmpTime"><option>5</option><option>15</option><option>30</option><option>45</option><option>60</option><option>120</option></select></label>
      <label><input type="checkbox" id="cmpGlobal"> <span data-ru="+ бафы из «Настроек»" data-en="+ buffs from Settings"></span></label>
      <span class="grow"></span>
      <button class="btn ghost" id="cmpClear" data-ru="Очистить всё" data-en="Clear all"></button>
    </div>
    <div class="tbl-wrap">
      <table id="cmpTable">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="cmpEmpty" data-ru="Пока пусто. Нажми «+ Добавить юнита» или открой юнита во вкладке «Юниты» → «В сравнение»." data-en="Empty. Press “+ Add unit” or open a unit in Units → “To compare”."></div>
    </div>
    <div class="hint" style="margin-top:6px" data-ru="Один юнит можно добавить несколько раз с разными бафами/трейтами. Зелёная полоса — лучший в столбце. Пустое поле апгрейда = максимальный." data-en="Same unit can be added several times with different buffs/traits. Green bar = best in column. Empty upgrade = max."></div>
    <div class="charts" id="charts"></div>
  </section>

  <!-- НАСТРОЙКИ -->
  <section class="tab" id="tab-settings">
    <div class="grid" id="settingsGrid"></div>
  </section>

  <!-- КАК СЧИТАЕТСЯ -->
  <section class="tab" id="tab-about">
    <div class="grid">
      <div class="card"><div class="card-header"><h2 data-ru="Формула урона" data-en="Damage formula"></h2></div>
        <div class="card-body" data-ru-html="<p>Урон удара = урон из вики × уровень (100 ур. = ×9,204, 110 ур. = ещё ×1,19) × (1 + общий бонус) × (1 + 5% × Limit Break отряда) × (1 + свой % ранга) × (1 + проклятие) × (1 + пассивка + реликвия) × (1 + трейт) × PWR × <b>(1 + бафы саппортов)</b>.</p><p>Каждая скобка — отдельный множитель, как в игре (сверено: Shinobi (Eternal) 256K). Бафы саппортов складываются между собой: Commander + Blossom = ×2,1.</p><p>DPS = урон / SPA × (1 + шанс крита × (множитель крита − 1)) × целей + DoT + призывы.</p>" data-en-html="<p>Hit = wiki damage × level (lv100 = ×9.204, lv110 = another ×1.19) × (1 + global) × (1 + 5% × team Limit Breaks) × (1 + own rank %) × (1 + curse) × (1 + passive + relic) × (1 + trait) × PWR × <b>(1 + support buffs)</b>.</p><p>Every bracket is a separate multiplier, as in game (checked: Shinobi (Eternal) 256K). Support buffs add up with each other: Commander + Blossom = ×2.1.</p><p>DPS = damage / SPA × (1 + crit chance × (crit mult − 1)) × targets + DoT + summons.</p>"></div></div>
      <div class="card"><div class="card-header"><h2 data-ru="DoT и призывы" data-en="DoT and summons"></h2></div>
        <div class="card-body" data-ru-html="<p><b>Кровотечение</b> считается от урона с бафами, <b>горение, яд, иссушение</b> — от урона без бафов саппортов (вики). Усилители DoT (Bleed Amp, Infernal Gaze) умножают урон DoT.</p><p><b>Призывы</b>: урон за цикл / цикл + урон за убийства × «врагов в секунду». Elyssia сама не атакует — только медузы и угри. Бафы вида «Призыв» (Zombie (Risen)) усиливают только призывы.</p><p><b>Урон за бой</b>: атаки в 0, SPA, 2·SPA…; DoT, не дотикавший к концу боя, не считается; призывы начинают бить после пути до врага.</p>" data-en-html="<p><b>Bleed</b> uses buffed damage, <b>burn, poison, wither</b> use damage without support buffs (wiki). DoT amplifiers (Bleed Amp, Infernal Gaze) multiply DoT damage.</p><p><b>Summons</b>: damage per cycle / cycle + damage per kill × kills per second. Elyssia does not attack herself — only jellies and eels. “Summon” buffs (Zombie (Risen)) boost summons only.</p><p><b>Battle damage</b>: attacks at 0, SPA, 2·SPA…; DoT not finished by the end is not counted; summons start after walking to the enemy.</p>"></div></div>
      <div class="card"><div class="card-header"><h2 data-ru="Твои данные" data-en="Your data"></h2></div>
        <div class="card-body" data-ru-html="<p>Всё, что ты вводишь (★ мои юниты, трейты, реликвии, проклятия, сравнение, настройки), хранится <b>только в этом браузере</b>. Обновление сайта их не стирает.</p><p><b>⬇ Экспорт</b> сохраняет файл — с ним можно перенести данные на другой компьютер или телефон (<b>⬆ Импорт</b>) или скинуть другу свою сборку.</p>" data-en-html="<p>Everything you enter (★ owned units, traits, relics, curses, comparison, settings) is stored <b>only in this browser</b>. Site updates don’t erase it.</p><p><b>⬇ Export</b> saves a file — use it to move data to another computer or phone (<b>⬆ Import</b>) or share your build with a friend.</p>"></div></div>
    </div>
  </section>
</main>

  en: { all: 'All', allR: 'All rarities', allT: 'All types', allRole: 'All roles', shown: (a, b) => `${a} of ${b} shown`,

const COUT = ['cost', 'dmg', 'maxhit', 'spa', 'rng', 'hitdps', 'dotdps', 'sumdps', 'dps', 'dpsk', 'gain', 'tot'];
const LOWER_BETTER = { cost: 1, spa: 1 };
function newRow(n) { return { name: n || '', upg: '', lvl: '', buffs: [], trait: '', relic: '', passive: true }; }
function addCmp(n) { state.compare.push(newRow(n)); save(); renderCompare(); }

    <td><select data-f="relic">${relicOpts(row.relic, t('fromProfile'))}</select></td>

    ${COUT.map(k => `<td class="num" data-o="${k}"></td>`).join('')}</tr>`).join('');
  updateCompare();
}
function cmpCalc() {
  const s = S(), gb = state.cmpGlobal ? gBuffs() : [];
  return state.compare.map(row => {
    const u = byName[row.name]; if (!u) return null;
    return M.calc(D, u, { upg: row.upg, lvl: row.lvl || null, buffs: [...row.buffs, ...gb], trait: row.trait, relic: row.relic,
      passive: row.passive, inp: inpFor(u.n) }, s);
  });
}
function updateCompare() {
  const res = cmpCalc();
  const best = {};
  for (const k of COUT) {
    const vals = res.filter(Boolean).map(r => r[k]).filter(v => v > 0);
    if (vals.length > 1) best[k] = LOWER_BETTER[k] ? Math.min(...vals) : Math.max(...vals);
  }
  document.querySelectorAll('#cmpTable tbody tr').forEach(tr_ => {
    const r = res[+tr_.dataset.i];
    tr_.querySelectorAll('[data-o]').forEach(td => {
      const k = td.dataset.o;
      if (!r) { td.textContent = ''; td.className = 'num'; return; }
      const v = r[k];
      td.textContent = k === 'gain' ? (v ? '+' + fmt(v * 100, 0) + '%' : '—') : k === 'spa' ? fmt(v, 2) : k === 'rng' ? fmt(v, 1)
        : k === 'dpsk' ? fmt(v, 1) : ['dotdps', 'sumdps'].includes(k) && !v ? '—' : short(v);
      td.title = k === 'gain' || k === 'spa' || k === 'rng' ? '' : fmt(v);
      td.className = 'num' + (k === 'dps' ? ' dps' : '') + (k === 'gain' && v > 0 ? ' gain' : '') + (best[k] !== undefined && v === best[k] ? ' out-best' : '');
    });
  });
  drawCharts(res);
}

function drawCharts(res) {
  const box = $('#charts');
  const items = state.compare.map((row, i) => ({ label: row.name + (state.compare.filter(x => x.name === row.name).length > 1 ? ` #${i + 1}` : ''), r: res[i] })).filter(x => x.r);
  if (!items.length) { box.innerHTML = ''; return; }
  if (box.children.length !== CHARTS.length || box.dataset.lang !== state.lang) {
    box.dataset.lang = state.lang;
    box.innerHTML = CHARTS.map(c => `<div class="card chart"><div class="card-header"><h2>${esc(t(c.title))}${c.id === 'tot' ? ` (${S().time} ${state.lang === 'ru' ? 'с' : 's'})` : ''}</h2></div>
      <div class="card-body">${c.stack ? `<div class="legend">${['hits', 'dot', 'summ'].map((k, j) => `<span><i style="background:${COLORS[j]}"></i>${esc(t(k))}</span>`).join('')}</div>` : ''}<canvas data-c="${c.id}"></canvas></div></div>`).join('');
  }
  box.querySelector('.chart:nth-child(4) h2').textContent = `${t('chTot')} (${S().time} ${state.lang === 'ru' ? 'с' : 's'})`;
  CHARTS.forEach(c => barChart(box.querySelector(`canvas[data-c="${c.id}"]`), items, c));
}
function barChart(cv, items, c) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 360, rowH = 24, padT = 6, padB = 6;
  const H = padT + padB + items.length * rowH;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  g.font = '12px Segoe UI, sans-serif';
  const labW = Math.min(W * 0.42, Math.max(...items.map(x => g.measureText(x.label).width)) + 10);
  const tot = items.map(x => c.keys.reduce((s, k) => s + (x.r[k] > 0 ? x.r[k] : 0), 0));
  const mx = Math.max(...tot, 1e-9), plotW = W - labW - 70;
  items.forEach((x, i) => {
    const y = padT + i * rowH;
    g.fillStyle = '#7fa8c4'; g.textAlign = 'right'; g.textBaseline = 'middle';
    let lab = x.label; while (g.measureText(lab).width > labW - 8 && lab.length > 4) lab = lab.slice(0, -2) + '…';
    g.fillText(lab, labW - 6, y + rowH / 2);
    let xo = labW;
    c.keys.forEach((k, j) => {
      const v = x.r[k] > 0 ? x.r[k] : 0, w = v / mx * plotW;
      g.fillStyle = c.stack ? COLORS[j] : (tot[i] === mx && c.id !== 'cost' && c.id !== 'spa' ? '#38bdf8' : '#0e7fb8');
      if (w > 0) { g.beginPath(); g.roundRect ? g.roundRect(xo, y + 4, w, rowH - 8, 4) : g.rect(xo, y + 4, w, rowH - 8); g.fill(); }
      xo += w;
    });
    g.fillStyle = '#f0f9ff'; g.textAlign = 'left';
    g.fillText(c.id === 'spa' ? fmt(tot[i], 2) : c.id === 'dpsk' ? fmt(tot[i], 1) : short(tot[i]), xo + 6, y + rowH / 2);
  });
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => drawCharts(cmpCalc()), 150); });

// ── НАСТРОЙКИ ──
function renderSettings() {
  const s = S(), L = state.lang === 'ru';
  const f = (k, label, hint, type, opts) => `<div class="field"><span>${esc(label)}<small>${esc(hint || '')}</small></span>${
    type === 'select' ? `<select data-s="${k}">${opts.map(([v, l]) => `<option value="${v}" ${String(s[k]) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`
    : type === 'check' ? `<input type="checkbox" data-s="${k}" ${s[k] ? 'checked' : ''}>`
    : `<input type="number" step="any" data-s="${k}" value="${s[k]}">`}</div>`;
  const gb = gBuffs();
  $('#settingsGrid').innerHTML = `
    <div class="card"><div class="card-header"><h2>${L ? 'Общие' : 'General'}</h2></div><div class="card-body key-block" style="margin:12px">
      ${f('lvl', L ? 'Уровень юнитов' : 'Unit level', L ? '100 ур. = ×9,204; 110 = ещё +19%' : 'lv100 = ×9.204; lv110 = +19% more', 'select', [['1', '1'], ['100', '100'], ['110', '110'], ['custom', L ? 'Свой множитель' : 'Custom multiplier']])}
      ${s.lvl === 'custom' ? f('lvlCustom', L ? 'Свой множитель уровня' : 'Custom level multiplier', '') : ''}
      ${f('lb', L ? 'Юнитов с Limit Break в отряде' : 'Limit Break units in team', L ? '+5% урона всем за каждого, до 6' : '+5% dmg to all per unit, up to 6')}
      ${f('gDmg', L ? 'Общий бонус урона, %' : 'Global damage, %', '')}
      ${f('gSpa', L ? 'Общее снижение SPA, %' : 'Global SPA reduction, %', '')}
      ${f('gCrit', L ? 'Общий бонус крит-шанса, %' : 'Global crit chance, %', '')}
      ${f('gRng', L ? 'Общий бонус радиуса, %' : 'Global range, %', '')}
      ${f('critDef', L ? 'Множитель крита по умолчанию' : 'Default crit multiplier', L ? 'вики: ×1,5' : 'wiki: ×1.5')}
      ${f('dot', L ? 'Учитывать DoT' : 'Count DoT', L ? 'кровотечение, горение, яд' : 'bleed, burn, poison', 'check')}
      ${f('sit', L ? 'Ситуативные бонусы реликвий' : 'Situational relic bonuses', L ? 'рейды, локации' : 'raids, locations', 'check')}
    </div></div>
    <div class="card"><div class="card-header"><h2>${L ? 'Бой' : 'Battle'}</h2></div><div class="card-body key-block" style="margin:12px">
      ${f('time', L ? 'Время боя, с' : 'Battle time, s', L ? 'для «Урона за бой»' : 'for “Battle damage”')}
      ${f('tick', L ? 'Интервал тика DoT, с' : 'DoT tick interval, s', L ? 'вики не указывает — 1' : 'not on wiki — 1')}
      ${f('kps', L ? 'Врагов убивается в секунду' : 'Kills per second', L ? 'призывы «за убийства»' : 'summons “per kill”')}
      ${f('walk', L ? 'Путь призыва до врага, с' : 'Summon walk time, s', '')}
      ${f('pwrp', L ? '1 PWR реликвии = +% урона' : '1 relic PWR = +% dmg', '')}
      ${f('resP', L ? 'Сопротивление врага: физ.' : 'Enemy resistance: phys', L ? 'урон × 100/(100+сопр.−PEN)' : 'dmg × 100/(100+res−PEN)')}
      ${f('resM', L ? 'Сопротивление врага: маг.' : 'Enemy resistance: magic', '')}
      <div class="hint" style="margin-top:8px">${L ? 'Целей под ударом (AoE):' : 'Targets per attack (AoE):'}</div>
      ${D.atypes.map(a => `<div class="field"><span>${esc(a)}</span><input type="number" step="any" min="0" data-tg="${esc(a)}" value="${(s.targets || {})[a] ?? 1}"></div>`).join('')}
    </div></div>
    <div class="card"><div class="card-header"><h2>${L ? 'Бафы на вкладке «Юниты»' : 'Buffs on Units tab'}</h2></div><div class="card-body">
      <div class="hint">${L ? 'Отмеченные бафы действуют на списке юнитов и карточках (и в сравнении, если включено «+ бафы из «Настроек»»).' : 'Checked buffs apply to the unit list and cards (and to comparison if “+ buffs from Settings” is on).'}</div>
      ${D.buffs.map(b => `<label class="field" style="grid-template-columns:24px 1fr"><input type="checkbox" data-gb="${esc(b.n)}" ${gb.includes(b.n) ? 'checked' : ''}><span>${esc(b.n)} <span class="tag">${esc(b.kind)} ${b.v}% · ${esc(b.who)}</span><small>${esc(b.note)}</small></span></label>`).join('')}
      <button class="btn" id="resetSettings" style="margin-top:10px">${L ? 'Сбросить настройки' : 'Reset settings'}</button>
    </div></div>`;
}
$('#settingsGrid').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.s) {
    const k = el.dataset.s;
    state.settings[k] = el.type === 'checkbox' ? el.checked : el.tagName === 'SELECT' ? el.value : (el.value === '' ? M.DEFAULT_SETTINGS[k] : Number(el.value));
    if (k === 'lvl') renderSettings();
  } else if (el.dataset.tg) {
    state.settings.targets = Object.assign({}, state.settings.targets, { [el.dataset.tg]: el.value === '' ? 1 : Number(el.value) });
  } else if (el.dataset.gb) {
    const set = new Set(gBuffs()); el.checked ? set.add(el.dataset.gb) : set.delete(el.dataset.gb);
    state.settings.buffs = [...set];
  } else return;
  save(); computeUnits(); renderUnits(); renderCompare();
});
$('#settingsGrid').addEventListener('click', e => {
  if (e.target.id !== 'resetSettings') return;
  state.settings = {}; save(); computeUnits(); renderUnits(); renderCompare(); renderSettings();
});

// ── экспорт / импорт ──
$('#btnExport').onclick = () => {
  const data = { app: 'aa-units', v: 1, date: new Date().toISOString(), settings: state.settings, profiles: state.profiles, compare: state.compare, cmpGlobal: !!state.cmpGlobal };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  a.download = `aa-units-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast(t('exported'));
};
$('#btnImport').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    const d = JSON.parse(txt);
    if (d.app !== 'aa-units') throw new Error();
    state.settings = d.settings || {}; state.profiles = d.profiles || {};
    state.compare = (d.compare || []).map(r => Object.assign(newRow(), r, { buffs: Array.isArray(r.buffs) ? r.buffs : [] }));
    state.cmpGlobal = !!d.cmpGlobal;
    save(); computeUnits(); applyLang(); toast(t('imported'));
  }).catch(() => toast(t('importBad'))).finally(() => { e.target.value = ''; });
};

// ── вкладки ──
function setTab(id) {
  state.tab = id; save();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  if (id === 'compare') drawCharts(cmpCalc());
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { state.lang = b.dataset.lang; save(); applyLang(); });

// ── старт ──
const dl = document.createElement('datalist'); dl.id = 'unitList';
dl.innerHTML = D.units.map(u => `<option value="${esc(u.n)}">`).join(''); document.body.appendChild(dl);
$('#ver').textContent = 'data ' + D.version;
$('#footVer').textContent = (state.lang === 'ru' ? 'данные от ' : 'data ') + D.version + ' · ' + D.units.length + ' units';
computeUnits();
applyLang();
setTab(state.tab || 'units');
</script>
